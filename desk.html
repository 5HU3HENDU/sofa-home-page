<title>The Whole Desk — School of Adults (concept)</title>
<style>*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(600px 300px at 82% 8%,rgba(255,214,120,.55),rgba(255,214,120,0) 70%),linear-gradient(180deg,#FBEED3,#F6DFAE);color:#1F1C18;height:100dvh;overflow:hidden}
#stage{position:absolute;inset:0;touch-action:manipulation}
.it{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;cursor:pointer;transform-origin:0 0;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .3s,filter .3s;text-align:center}
.it.topic{width:84px;height:102px}
.it.sub{width:64px;height:78px}
.it.pill{width:84px;height:30px;justify-content:center}
.it.dimmed{filter:grayscale(1) brightness(.92)}
.it.active-topic{box-shadow:0 0 0 3px rgba(180,120,0,.55),0 0 18px rgba(180,120,0,.35);border-radius:18px}
.ic{display:block;line-height:0}
.topic .ic svg{width:56px;height:56px}
.sub .ic svg{width:40px;height:40px}
.lb{font-family:Georgia,serif;font-size:15px;font-weight:700;line-height:1.25;margin-top:4px}
.sub .lb{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:11px;font-weight:600}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#C0392B;animation:blink 1.6s ease-in-out infinite;vertical-align:middle;margin-right:4px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.pl{display:inline-block;font-size:10px;font-weight:600;padding:2px 6px;border:1.5px solid #1F1C18;border-radius:999px;background:#fff;white-space:nowrap}
.note{display:inline-block;background:#FFE08A;border:1px solid #D9A400;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;transform:rotate(-2deg);margin-top:3px}
.glow{animation:glow 2.2s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 rgba(200,120,0,0))}50%{filter:drop-shadow(0 0 8px rgba(200,120,0,.55))}}
.it.flutter .ic svg{animation:flutter 3.5s ease-in-out infinite;transform-origin:bottom left}
@keyframes flutter{0%,100%{transform:rotate(0)}50%{transform:rotate(-2.5deg)}}
.mote{position:absolute;width:5px;height:5px;border-radius:50%;background:rgba(120,90,40,.35);animation:floaty 5s ease-in-out infinite;pointer-events:none}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
#boardsLink{position:absolute;right:12px;bottom:10px;font-size:12px;color:#1F1C18;opacity:.45;text-decoration:none;z-index:5}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1F1C18;color:#F7F3E8;padding:10px 18px;border-radius:999px;font-size:14px;display:none;z-index:10;white-space:nowrap}</style>
</head>

    regions.forEach(function (r) {
      if (mi >= movers.length) return;
      var rw = r.x1 - r.x0, rh = r.y1 - r.y0;
      var cols = Math.max(1, Math.floor((rw + GAP) / (w + GAP)));
      var rows = Math.max(1, Math.floor((rh + GAP) / (h + GAP)));
      var take = Math.min(movers.length - mi, cols * rows);
      if (take <= 0) return;
      var rowsUsed = Math.ceil(take / cols);
      var blockH = rowsUsed * h + (rowsUsed - 1) * GAP;
      var y0 = r.hug === 'top' ? r.y0 : (r.hug === 'bottom' ? r.y1 - blockH : r.y0 + (rh - blockH) / 2);
      for (var row = 0; row < rowsUsed; row++) {
        var inRow = Math.min(cols, take - row * cols);
        var rowW = inRow * w + (inRow - 1) * GAP;
        var x0 = r.hug === 'left' ? r.x0 : (r.hug === 'right' ? r.x1 - rowW : r.x0 + (rw - rowW) / 2);
        for (var c = 0; c < inRow; c++) {
          var t = movers[mi++];
          var cx = x0 + c * (w + GAP) + w / 2;
          var cy = y0 + row * (h + GAP) + h / 2;
          t._el.classList.add('dimmed');
          placeCenter(t._el, cx, cy, s, TOPIC_W, TOPIC_H, 0);
          show(t._el);
          t.subs.forEach(function (su) {
            place(su._el, cx - w / 2, cy - h / 2, 0.5, 0);
            hide(su._el);
          });
        }
      }
    });
  }
  function layout() {
    var W = stage.clientWidth, H = stage.clientHeight;
    if (!W || !H) return;
    if (expanded === null) layoutCollapsed(W, H);
    else layoutExpanded(W, H, expanded);
  }
  function toggleTopic(ti) { expanded = (expanded === ti) ? null : ti; layout(); }
  stage.addEventListener('click', function () { if (expanded !== null) { expanded = null; layout(); } });
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(layout, 120);
  });
  layout();
})();
</script>
</body>
</html>
